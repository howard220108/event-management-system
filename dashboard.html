<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard</title>

<link rel="stylesheet" href="style.css">

<style>
body{
    margin:0;
    font-family:Arial;
    background:#f4f6fb;
}

header{
    background:#2563eb;
    color:white;
    padding:20px;
}

.container{
    width:90%;
    margin:auto;
}

.cards{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:20px;
    margin-top:30px;
}

.card{
    background:white;
    padding:25px;
    border-radius:15px;
    box-shadow:0 5px 15px rgba(0,0,0,.1);
}

.card h3{
    margin:0;
    color:#666;
}

.card h1{
    margin-top:10px;
}

table{
    width:100%;
    margin-top:30px;
    border-collapse:collapse;
    background:white;
}

th,td{
    padding:15px;
    border-bottom:1px solid #ddd;
}

th{
    background:#2563eb;
    color:white;
}
</style>

</head>

<body>

<header>

<h1>📊 Event Management Dashboard</h1>

<p>Welcome Howard</p>

</header>

<div class="container">

<div class="cards">

<div class="card">

<h3>Total Income</h3>

<h1>RM 0</h1>

</div>

<div class="card">

<h3>Total Expense</h3>

<h1>RM 0</h1>

</div>

<div class="card">

<h3>Profit</h3>

<h1>RM 0</h1>

</div>

<div class="card">

<h3>Stock</h3>

<h1>120</h1>

</div>

</div>

<table>

<tr>

<th>Date</th>

<th>Description</th>

<th>Amount</th>

</tr>

<tr>

<td>2 Aug</td>

<td>System Created</td>

<td>RM 0</td>

</tr>

</table>

</div>

</body>
</html>
